[global]
# ── TODO VOR PRODUKTIVBETRIEB ────────────────────────────────────────────────
# repo1-path zeigt derzeit auf ein lokales Volume. Eine Sicherung auf derselben
# Hardware wie die Datenbank schützt gegen genau nichts. Vor dem Produktivbetrieb
# hier eine Einbindung auf ein NAS setzen — oder auf S3 umstellen:
#
#   repo1-type=s3
#   repo1-s3-bucket=<bucket>
#   repo1-s3-endpoint=<endpoint>
#   repo1-s3-region=<region>
#   repo1-s3-key=<zugangsschluessel>
#   repo1-s3-key-secret=<geheimnis>
# ─────────────────────────────────────────────────────────────────────────────
repo1-path=/var/lib/pgbackrest

# Zwei vollständige Sicherungen vorhalten; ältere werden samt zugehörigem
# WAL-Archiv automatisch entfernt. Ohne Aufbewahrungsregel läuft die Platte voll.
repo1-retention-full=2
repo1-retention-diff=6

# Komprimiert; zstd ist bei Zeitreihendaten deutlich schneller als gzip bei
# vergleichbarer Größe.
compress-type=zst
compress-level=3

# Prüfsummen über jede gesicherte Datei — eine Sicherung, deren Unversehrtheit
# niemand prüft, ist eine Vermutung.
repo1-bundle=y
checksum-page=y

process-max=2
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

start-fast=y

# Kein archive-async: Bei rund 2,5 Messungen pro Sekunde fällt etwa alle fünf
# Minuten ein WAL-Segment an (archive_timeout). Synchrones Archivieren ist dabei
# unbemerkt schnell genug und spart einen Hintergrundprozess samt Spool-Verzeichnis
# — also eine Fehlerquelle weniger.

[ohb]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres
