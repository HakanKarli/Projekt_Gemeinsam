# =============================================================
# Einziger Einstiegspunkt des Systems.
#
# Löst drei Probleme auf einmal:
#   - Der Vite-Entwicklungsserver läuft nicht länger im Dauerbetrieb.
#   - Das Frontend spricht relative Pfade an, statt Port 3001 fest zu verdrahten.
#   - Ein offener Port statt drei.
# =============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Plotly und MQTT.js sind große Bündel — Kompression ist hier deutlich spürbar.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Gehashte Bündel dürfen dauerhaft zwischengespeichert werden …
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # … index.html jedoch nie, sonst bleibt nach einer Auslieferung die alte Version stehen.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Live-Alarme (Server-Sent Events) ──────────────────────
    # MUSS vor /api/ stehen: nginx wählt bei Präfixen den längsten Treffer, aber
    # die Absicht soll auch beim Lesen erkennbar sein.
    # Ohne proxy_buffering off sammelt nginx die Ereignisse, bis sein Puffer voll
    # ist — Alarme kämen dann verspätet oder gar nicht an.
    location /api/alerts/stream {
        proxy_pass http://api:3001/api/alerts/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # ── REST-Schnittstelle ────────────────────────────────────
    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Der PDF-Report kann bei großen Zeiträumen dauern.
        proxy_read_timeout 120s;
        client_max_body_size 2m;
    }

    # ── MQTT über WebSocket ───────────────────────────────────
    # Die Upgrade-Header sind zwingend; ohne sie bleibt es eine gewöhnliche
    # HTTP-Anfrage und die Verbindung scheitert stillschweigend.
    location /mqtt {
        proxy_pass http://mosquitto:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # Single-Page-Anwendung: unbekannte Pfade liefern index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
